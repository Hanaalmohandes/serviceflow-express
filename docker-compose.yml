services:
  certificates:
    image: alpine:3.21
    command:
      - sh
      - -c
      - |
        apk add --no-cache openssl
        if [ ! -f /certs/localhost.pem ]; then
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /certs/localhost-key.pem \
            -out /certs/localhost.pem \
            -days 365 \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,DNS:api,DNS:frontend"
        fi
    volumes:
      - tls-certs:/certs

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hana}
      POSTGRES_DB: serviceflow_express
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d serviceflow_express"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-hana}@postgres:5432/serviceflow_express
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env before starting Docker}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env before starting Docker}
    ports:
      - "3001:3001"
    volumes:
      - tls-certs:/app/certs:ro
    depends_on:
      certificates:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      API_URL: https://api:3001
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env before starting Docker}
      NODE_EXTRA_CA_CERTS: /app/certs/localhost.pem
    ports:
      - "5173:5173"
    volumes:
      - tls-certs:/app/certs:ro
    depends_on:
      certificates:
        condition: service_completed_successfully
      api:
        condition: service_started

volumes:
  postgres-data:
  tls-certs:
